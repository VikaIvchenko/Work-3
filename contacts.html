<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти</title>
    <link rel="stylesheet" href="./css/main.css">
<style>
        .contacts {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .contacts h1 {
            text-align: center;
            color: #2457A6;
            margin-bottom: 25px;
        }

        .contact-form {
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch;
            gap: 10px;
            width: 100%;
        }

        .contact-form label {
            display: block;
            font-weight: bold;
            color: #26384a;
            margin-top: 8px;
        }

        .contact-form input,
        .contact-form textarea {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid #d1ddeb;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .contact-form textarea {
            resize: vertical;
        }

        .contact-form button {
            display: block;
            width: 105px;
            padding: 10px;
            margin-top: 8px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .contact-form button:hover {
            background-color: #2457A6;
        }
    </style>
</head>
<body>

    <header class="header">
        <nav class="header__nav">
            <ul class="header__list-menu">
                <li class="header__item">
                    <a href="./index.html" class="header__link">Головна</a>
                </li>
                <li class="header__item">
                    <a href="./news.html" class="header__link">Новини</a>
                </li>
                <li class="header__item">
                    <a href="./education.html" class="header__link">Навчання</a>
                </li>
                <li class="header__item">
                    <a href="./contacts.html" class="header__link">Контакти</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="contacts">
        <h1>Зворотний зв’язок</h1>

        <form class="contact-form" action="#" method="post">

            <label for="name">Ім’я</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Ваше ім’я"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Ваш email"
                required
            >

            <label for="message">Повідомлення</label>
            <textarea
                id="message"
                name="message"
                placeholder="Ваше повідомлення"
                rows="6"
                required
            ></textarea>

            <button type="submit">Надіслати</button>

        </form>
    </main>

    <footer class="footer">
